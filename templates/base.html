<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Aruvon Learning Solutions{% endblock %}</title>

<meta name="description" content="{% block description %}Skill development and placement training institute in Coimbatore, Tamil Nadu.{% endblock %}">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
<link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='img/favicon-96x96.png') }}">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">

<!-- Web App Manifest -->
<link rel="manifest" href="{{ url_for('static', filename='img/site.webmanifest') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

{% include "partials/nav.html" %}

{% block content %}{% endblock %}

{% include "partials/footer.html" %}

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
